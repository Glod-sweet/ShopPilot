[project]
name = "pilot-agent"
version = "0.2.0"
description = "ShopPilot Agent 服务：意图识别、RAG 检索、MCP 工具编排与流式输出"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    # Agent 编排
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.0",
    # MCP 客户端（Tavily 联网工具）
    "mcp>=1.9.0",
    # 会话记忆
    "redis>=5.0.0",
    # 向量检索
    "numpy>=1.26",
    # 向量回填脚本（scripts/embed_backfill.py）读写 MySQL 用
    "pymysql>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
# 本项目是服务，不是给别人 import 的库。
# package = false 让 uv 只管理依赖、不尝试把项目本身打成 wheel。
# 否则 hatchling 会去找与项目名同名的目录（pilot_agent），找不到就报
# "Unable to determine which files to ship inside the wheel"。
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# SIM117：MCP 的 stdio_client + ClientSession 两层嵌套 with 表达"连接 → 会话"两个阶段，
# 合并成一行反而看不出层次，故保留嵌套写法。
# SIM102：mock 脚本里的条件判断，合并后可读性下降。
ignore = ["SIM117", "SIM102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 显式指定 fixture 事件循环作用域，消除 pytest-asyncio 的弃用警告。
# 用 function 是因为各测试之间不该共享事件循环（Redis 客户端会跨用例串状态）。
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
